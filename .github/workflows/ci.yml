name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Validate evaluation data
        run: |
          uv run cyberslm-eval validate
          uv run cyberslm-eval validate --dataset evals/datasets/retrieval.jsonl
          uv run cyberslm-eval validate --dataset evals/datasets/selective-rag.jsonl
          uv run cyberslm-eval validate --dataset evals/datasets/safety.jsonl
          uv run cyberslm-eval validate --dataset evals/datasets/mode-coverage.jsonl
          uv run cyberslm-eval validate --dataset evals/datasets/cyberseceval-mitre-frr.jsonl

      - name: Build distribution
        run: uv build

  portable-runtime:
    name: Portable runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CYBERSLM_MODEL_BACKEND: transformers
      CYBERSLM_MODEL_ID: google/gemma-3-4b-it
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Install portable runtime
        run: uv sync --locked --extra dev --extra transformers

      - name: Verify lazy backend
        run: uv run python -c "from cyberslm.config import settings; from cyberslm.model import create_backend; backend = create_backend(settings); assert backend.status['backend'] == 'transformers'; import torch, transformers; print(torch.__version__, transformers.__version__)"

      - name: Run pinned multimodal generation smoke test
        run: |
          uv run python scripts/smoke_transformers.py
          uv run python scripts/smoke_transformers.py --quantization 8bit --text-only
          uv run python scripts/smoke_transformers.py --quantization 4bit

      - name: Test model contracts
        run: uv run pytest tests/test_model.py
