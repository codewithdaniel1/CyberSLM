[project]
name = "cyberslm"
version = "0.5.0"
description = "A private, local-first multimodal cybersecurity assistant."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastembed>=0.8,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "streamlit>=1.48,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
cyberslm-backup = "cyberslm.backup:main"
cyberslm-eval = "cyberslm.evaluation.cli:main"
cyberslm-knowledge = "cyberslm.knowledge.cli:main"
cyberslm-train = "cyberslm.training.cli:main"

[project.optional-dependencies]
mlx = ["mlx-vlm>=0.3.4,<1"]
transformers = [
  "sentencepiece>=0.2,<1",
  "torch>=2.7,<3",
  "transformers>=5,<6",
  "torchvision>=0.22,<1",
]
train = ["mlx-vlm[train]>=0.3.4,<1"]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberslm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
