[project]
name = "cyberslm"
version = "0.5.0a1"
description = "A portable applied-cryptography model training, evaluation, RAG, and export toolkit."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastembed>=0.8,<1",
  "httpx>=0.28,<1",
  "psutil>=5.9,<8",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
cyberslm-benchmark = "cyberslm.benchmark:main"
cyberslm-eval = "cyberslm.evaluation.cli:main"
cyberslm-knowledge = "cyberslm.knowledge.cli:main"
cyberslm-ollama = "cyberslm.ollama:main"
cyberslm-train = "cyberslm.training.cli:main"
cyberslm-unsloth = "cyberslm.training.unsloth_run:main"

[project.optional-dependencies]
mlx = ["mlx-vlm>=0.3.4,<1"]
transformers = [
  "accelerate>=1.7,<2",
  "bitsandbytes>=0.48,<1",
  "peft>=0.17,<1",
  "pillow>=11,<13",
  "sentencepiece>=0.2,<1",
  "torch>=2.7,<3",
  "transformers>=5,<6",
  "torchvision>=0.22,<1",
]
train = ["mlx-vlm[train]>=0.3.4,<1"]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberslm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
